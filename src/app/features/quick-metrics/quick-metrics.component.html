<section class="mb-2">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h2 class="text-lg font-semibold text-slate-900">Quick Summary — Paper's Reported Best Results</h2>
      <p class="text-sm text-slate-500">Key metrics from AlBassam &amp; AlShahrani (2025) PLOS ONE.</p>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (card of cards; track card.label) {
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">{{ card.label }}</span>
          @if (card.delta) {
            <span class="text-xs font-medium rounded-full px-2 py-0.5"
                  [class.bg-green-100]="card.deltaType === 'good'"
                  [class.text-green-700]="card.deltaType === 'good'"
                  [class.bg-red-100]="card.deltaType === 'bad'"
                  [class.text-red-700]="card.deltaType === 'bad'">
              {{ card.delta }}
            </span>
          }
        </div>
        <div class="flex items-baseline gap-1 mb-1">
          <span class="text-2xl font-bold text-slate-900">{{ card.value }}</span>
        </div>
        <p class="text-xs text-slate-500 leading-tight">{{ card.sublabel }}</p>
      </div>
    }
  </div>
</section>
